<!DOCTYPE html>
<!--
    =============================================================
    ARCHIVO: index.html
    PROYECTO: Playa Alerta
    DESCRIPCIÓN: Documento HTML principal de la aplicación.
                 Define únicamente la ESTRUCTURA del contenido
                 (responsabilidad del HTML), delegando:
                   - Estilos  → styles.css
                   - Lógica   → map.js  (clases OOP)
    AUTOR: Equipo Playa Alerta
    ÚLTIMA ACTUALIZACIÓN: 2026-11-02
    =============================================================
-->
<html lang="es">

<head>
    <!-- ── Meta etiquetas obligatorias ── -->
    <meta charset="UTF-8">
    <!-- Ajusta el viewport para que la app se vea bien en móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playa Alerta</title>

    <!-- ── Hoja de estilos de Leaflet (mapa interactivo) ── -->
    <!-- Debe cargarse ANTES de styles.css para que nuestras reglas puedan sobrescribirla -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- ── Tailwind CSS (clases utilitarias de diseño) ── -->
    <!-- Cargado desde CDN; en producción se reemplazaría por un build local -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ── Hoja de estilos propia del proyecto ── -->
    <!-- Contiene únicamente lo que Tailwind no puede cubrir por defecto -->
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="font-sans">
    <!--
        NOTA SOBRE LA ESTRUCTURA:
        Todos los elementos usan "position: absolute" o "position: fixed"
        para superponerse sobre el mapa, que ocupa el 100% de la pantalla.
        El z-index controla qué elementos quedan encima de qué otros.
    -->

    <!-- ═══════════════════════════════════════════════════════
         SECCIÓN 1 — MAPA PRINCIPAL
         Elemento base de la aplicación. Leaflet inyectará aquí
         el mapa interactivo al ejecutar MapController.inicializar().
         z-index: 0 → capa más baja (todo lo demás queda encima)
         ═══════════════════════════════════════════════════════ -->
    <main id="map">
        <!-- Leaflet llena este elemento dinámicamente con el mapa -->
    </main>


    <!-- ═══════════════════════════════════════════════════════
         SECCIÓN 2 — LOGO / IDENTIDAD DE MARCA
         Esquina superior izquierda, flotando sobre el mapa.
         Usa "glassmorphism": fondo translúcido + blur de Tailwind.
         z-index: 20 → encima del mapa pero debajo de modales
         ═══════════════════════════════════════════════════════ -->
    <div class="absolute top-4 left-4 z-20
                flex items-center gap-2
                bg-white/85 backdrop-blur-sm
                rounded-2xl shadow-lg px-3 py-2"
         role="banner"
         aria-label="Logotipo Playa Alerta">

        <!-- Imagen del logo circular -->
        <img src="logo.png"
             alt="Logo de Playa Alerta"
             class="h-12 w-12 rounded-full object-cover shadow-md">

        <!-- Nombre de la marca en dos líneas con color institucional -->
        <span class="text-[#E59837] font-extrabold text-lg tracking-widest uppercase leading-tight">
            Playa<br>Alerta
        </span>
    </div>


    <!-- ═══════════════════════════════════════════════════════
         SECCIÓN 3 — BOTÓN DE PERFIL DE USUARIO
         Esquina superior derecha, flotando sobre el mapa.
         Al hacer click, UIController abrirá el panel de perfil.
         ═══════════════════════════════════════════════════════ -->
    <div class="absolute top-4 right-4 z-20">

        <!-- id="btnUsuario" → UIController lo busca por este ID -->
        <button id="btnUsuario"
                class="w-14 h-14 rounded-full
                       bg-[#003366] hover:bg-[#002244]
                       flex items-center justify-center
                       shadow-lg active:scale-95 transition-all
                       focus:outline-none"
                aria-label="Abrir perfil de usuario">

            <!-- Ícono SVG de silueta de persona (no depende de fuentes externas) -->
            <svg class="w-7 h-7 text-white"
                 fill="currentColor"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <!--
                    Path describe la silueta de una persona:
                    - Círculo superior = cabeza
                    - Forma inferior   = cuerpo / hombros
                -->
                <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4
                         7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2
                         0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
        </button>
    </div>


    <!-- ═══════════════════════════════════════════════════════
         SECCIÓN 4 — MENÚ DE REPORTE RÁPIDO
         Esquina inferior derecha. Panel con efecto glassmorphism
         que agrupa los botones de reporte disponibles.
         Los estilos de #quickReportMenu viven en styles.css.
         ═══════════════════════════════════════════════════════ -->
    <div id="quickReportMenu"
         class="absolute bottom-4 right-4 z-20
                rounded-3xl shadow-2xl px-5 pt-3 pb-4"
         role="region"
         aria-label="Menú de reporte rápido">

        <!-- Etiqueta del panel -->
        <p class="text-xs font-bold text-gray-500
                  uppercase tracking-widest mb-3 text-center">
            Reporte Rápido
        </p>

        <!-- Contenedor flex horizontal de los botones de reporte -->
        <div class="flex items-end gap-5">

            <!-- ── Botón 1: Tráfico ── -->
            <div class="flex flex-col items-center gap-1">
                <!-- Etiqueta textual del botón -->
                <span class="text-xs font-semibold text-gray-600 uppercase tracking-wide">
                    Tráfico
                </span>

                <!--
                    id="btnTrafico" → UIController._registrarEventoTrafico() lo escucha.
                    La clase "report-btn" aplica el estilo circular definido en styles.css.
                    El color de fondo (amber) se añade con Tailwind.
                -->
                <button id="btnTrafico"
                        class="report-btn bg-amber-400 hover:bg-amber-500"
                        aria-label="Reportar tráfico en mi ubicación">

                    <!-- Ícono SVG de semáforo — representa tráfico vehicular -->
                    <svg class="w-8 h-8 text-white"
                         fill="currentColor"
                         viewBox="0 0 24 24"
                         aria-hidden="true">
                        <!--
                            Semáforo simplificado:
                            - Cuerpo vertical con 3 luces (verde, amarilla, roja)
                        -->
                        <path d="M12 2C9.24 2 7 4.24 7 7v10c0 2.76 2.24 5 5 5s5-2.24
                                 5-5V7c0-2.76-2.24-5-5-5zm0 14.5c-.83
                                 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5
                                 1.5-.67 1.5-1.5 1.5zm0-5c-.83
                                 0-1.5-.67-1.5-1.5S11.17 8 12 8s1.5.67 1.5
                                 1.5S12.83 11.5 12 11.5zm0-5c-.83
                                 0-1.5-.67-1.5-1.5S11.17 4 12 4s1.5.67 1.5
                                 1.5S12.83 6.5 12 6.5z"/>
                    </svg>
                </button>
            </div>

            <!-- ── Botón 2: Incidencias viales ── -->
            <div class="flex flex-col items-center gap-1">
                <!-- Etiqueta textual del botón -->
                <span class="text-xs font-semibold text-gray-600 uppercase tracking-wide">
                    Incidencias
                </span>

                <!--
                    id="btnIncidencia" → UIController._registrarEventoIncidencia() lo escucha.
                    Color rojo para reflejar urgencia / peligro.
                -->
                <button id="btnIncidencia"
                        class="report-btn bg-red-500 hover:bg-red-600"
                        aria-label="Reportar incidencia vial en mi ubicación">

                    <!-- Ícono SVG de triángulo de advertencia — símbolo universal de alerta -->
                    <svg class="w-8 h-8 text-white"
                         fill="currentColor"
                         viewBox="0 0 24 24"
                         aria-hidden="true">
                        <!--
                            Triángulo de advertencia con símbolo de exclamación:
                            - Triángulo exterior: M1 21h22L12 2 1 21
                            - Barra de exclamación: rectángulo y cuadrado inferiores
                        -->
                        <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
                    </svg>
                </button>
            </div>

        </div><!-- /flex botones -->
    </div><!-- /quickReportMenu -->


    <!-- ═══════════════════════════════════════════════════════
         SECCIÓN 5 — MODAL DE REGISTRO DE REPORTE
         Se muestra encima de todo cuando el usuario hace click en
         un botón del menú de reporte rápido.
         z-index: 50 → encima del mapa y de los paneles flotantes
         ═══════════════════════════════════════════════════════ -->
    <div id="reportModal"
         class="hidden fixed inset-0 z-50 flex items-center justify-center"
         role="dialog"
         aria-modal="true"
         aria-labelledby="modalTitle">

        <!-- Fondo oscuro semitransparente (overlay) -->
        <div id="modalOverlay"
             class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>

        <!-- Tarjeta del formulario -->
        <div class="relative w-full max-w-md mx-4
                    bg-white rounded-3xl shadow-2xl
                    overflow-hidden flex flex-col">

            <!-- ── Cabecera coloreada ── -->
            <div id="modalHeader"
                 class="px-6 pt-5 pb-4 flex items-center justify-between transition-colors">

                <!-- Tipo de reporte (se actualiza dinámicamente) -->
                <div class="flex items-center gap-3">
                    <!-- Ícono del tipo de reporte -->
                    <div id="modalIcon"
                         class="w-11 h-11 rounded-full flex items-center justify-center shadow-md">
                    </div>
                    <!-- Título del tipo de reporte -->
                    <div>
                        <div class="flex items-center gap-2">
                            <p class="text-xs font-semibold text-white/80 uppercase tracking-widest">
                                Reporte en Mapa
                            </p>
                            <!-- Badge de coordenadas del punto clickeado -->
                            <span id="modalCoordsBadge"
                                  class="text-[10px] font-mono text-white/90 bg-white/20 px-2 py-0.5 rounded-full">
                                📍 Punto
                            </span>
                        </div>
                        <h2 id="modalTitle"
                            class="text-lg font-extrabold text-white leading-tight">
                            Incidencia Vial
                        </h2>
                    </div>
                </div>

                <!-- Botón cerrar (✕) -->
                <button id="btnCerrarModal"
                        class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/40
                               flex items-center justify-center transition-colors
                               focus:outline-none"
                        aria-label="Cerrar formulario">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor"
                         stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- ── Selector de categoría (pills rápidos) ── -->
            <div class="px-6 pt-3 pb-1 flex gap-2">
                <button type="button"
                        id="tabTipoIncidencia"
                        class="flex-1 py-1.5 px-3 rounded-xl text-xs font-bold uppercase tracking-wider
                               border transition-all flex items-center justify-center gap-1.5
                               bg-red-50 text-red-700 border-red-300">
                    <span class="w-2 h-2 rounded-full bg-red-500"></span>
                    Incidencia
                </button>
                <button type="button"
                        id="tabTipoTrafico"
                        class="flex-1 py-1.5 px-3 rounded-xl text-xs font-bold uppercase tracking-wider
                               border transition-all flex items-center justify-center gap-1.5
                               bg-gray-100 text-gray-500 border-gray-200">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    Tráfico
                </button>
            </div>

            <!-- ── Cuerpo del formulario ── -->
            <form id="reportForm"
                  class="px-6 pb-6 pt-2 flex flex-col gap-3"
                  novalidate>

                <!-- Campo: Título del reporte -->
                <div class="flex flex-col gap-1">
                    <label for="inputTitulo"
                           class="text-xs font-bold text-gray-500 uppercase tracking-widest">
                        Título
                    </label>
                    <input id="inputTitulo"
                           type="text"
                           placeholder="Ej. Accidente en la costera…"
                           maxlength="80"
                           required
                           class="w-full rounded-xl border border-gray-200
                                  bg-gray-50 px-4 py-2.5 text-sm text-gray-800
                                  placeholder-gray-400
                                  focus:outline-none focus:ring-2 focus:ring-offset-1
                                  transition">
                </div>

                <!-- Campo: Descripción del reporte -->
                <div class="flex flex-col gap-1">
                    <label for="inputDescripcion"
                           class="text-xs font-bold text-gray-500 uppercase tracking-widest">
                        Descripción
                    </label>
                    <textarea id="inputDescripcion"
                              placeholder="Describe brevemente lo que está pasando…"
                              rows="4"
                              maxlength="300"
                              class="w-full rounded-xl border border-gray-200
                                     bg-gray-50 px-4 py-2.5 text-sm text-gray-800
                                     placeholder-gray-400 resize-none
                                     focus:outline-none focus:ring-2 focus:ring-offset-1
                                     transition"></textarea>
                </div>

                <!-- Campo: Adjuntos (foto / video) -->
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-widest">
                        Adjuntos
                    </label>

                    <!-- Zona de clic para adjuntar archivos -->
                    <label for="inputAdjuntos"
                           id="adjuntosLabel"
                           class="flex flex-col items-center justify-center gap-2
                                  rounded-xl border-2 border-dashed border-gray-300
                                  bg-gray-50 py-4 cursor-pointer
                                  hover:border-gray-400 hover:bg-gray-100 transition">

                        <!-- Ícono de cámara / clip -->
                        <svg class="w-7 h-7 text-gray-400" fill="none" stroke="currentColor"
                             stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0
                                     0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0
                                     0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2
                                     2 0 01-2-2V9z"/>
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>

                        <span id="adjuntosTexto"
                              class="text-xs text-gray-500 text-center leading-snug">
                            Toca para adjuntar foto o video
                        </span>
                    </label>

                    <!-- Input oculto: acepta imágenes y videos -->
                    <input id="inputAdjuntos"
                           type="file"
                           accept="image/*,video/*"
                           multiple
                           class="hidden">
                </div>

                <!-- ── Campo: STATUS (Y / N) ── -->
                <div class="flex flex-col items-center justify-center gap-1.5 py-1">
                    <div class="flex items-center justify-center gap-4">
                        <!-- Botón Y (Activo / Sí) -->
                        <button type="button"
                                id="btnStatusY"
                                data-status="Y"
                                class="status-toggle-btn active-y"
                                aria-label="Status: Activo / Sí">
                            Y
                        </button>
                        <!-- Botón N (Inactivo / No) -->
                        <button type="button"
                                id="btnStatusN"
                                data-status="N"
                                class="status-toggle-btn"
                                aria-label="Status: Resuelto / No">
                            N
                        </button>
                    </div>
                    <!-- Etiqueta STATUS tal como en la referencia -->
                    <span class="text-xs font-black text-gray-500 uppercase tracking-widest text-center">
                        STATUS
                    </span>
                    <!-- Input oculto para guardar el estado -->
                    <input type="hidden" id="inputStatus" value="Y">
                </div>

                <!-- Separador visual -->
                <hr class="border-gray-100">

                <!-- Botón de envío -->
                <button type="submit"
                        id="btnEnviarReporte"
                        class="w-full py-3 rounded-2xl
                               font-bold text-white text-sm uppercase tracking-widest
                               shadow-lg active:scale-95
                               transition-all focus:outline-none">
                    Enviar Reporte
                </button>
            </form>

        </div><!-- /tarjeta -->
    </div><!-- /reportModal -->


    <!-- ═══════════════════════════════════════════════════════
         SCRIPTS — al final del <body> para no bloquear el render
         Orden de carga obligatorio:
           1. Leaflet.js  → debe estar disponible antes que map.js
           2. map.js      → usa las clases OOP del proyecto
         ═══════════════════════════════════════════════════════ -->

    <!-- 1. Librería de mapas interactivos Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 2. Módulo principal del proyecto (MapController, UIController, PlayaAlertaApp) -->
    <script src="map.js"></script>

</body>
</html>
